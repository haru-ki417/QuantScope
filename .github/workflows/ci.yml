name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    # 画面（WPF）と計算の部品を、実際に使う Windows で確かめる
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # 失敗したときは、エラーの行を GitHub の画面に出す
      - name: Build
        shell: pwsh
        run: |
          dotnet build src/QuantScope.App --configuration Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 20 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Test
        run: dotnet test --project tests/QuantScope.Tests --configuration Release

  web:
    # ブラウザー版（Blazor WebAssembly）がビルドできるかを確かめる
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Build
        run: dotnet build src/QuantScope.Web --configuration Release
